<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поисковик ответов по Физике</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d9dee8;
            --blue: #2563eb;
            --green-bg: #ecfdf5;
            --green: #047857;
            --shadow: 0 8px 22px rgba(31, 41, 55, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap {
            width: min(960px, calc(100% - 28px));
            margin: 28px auto;
        }
        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 30px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 22px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 15px;
        }
        .tab:hover { border-color: var(--blue); color: var(--blue); }
        .tab.active {
            background: var(--blue);
            color: white;
            border-color: var(--blue);
        }
        .search {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 17px;
            outline: none;
            box-shadow: var(--shadow);
        }
        .search:focus { border-color: var(--blue); }
        .counter {
            margin: 14px 2px;
            color: var(--muted);
            font-size: 14px;
        }
        .results { display: grid; gap: 12px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(31, 41, 55, 0.04);
        }
        .badge {
            display: inline-block;
            margin-bottom: 8px;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .physics { background: #fee2e2; color: #991b1b; }
        .question {
            font-size: 16px;
            line-height: 1.45;
            font-weight: 650;
            margin-bottom: 10px;
            white-space: pre-line;
        }
        .answer {
            color: var(--green);
            background: var(--green-bg);
            border-left: 4px solid #10b981;
            border-radius: 0 7px 7px 0;
            padding: 9px 12px;
            line-height: 1.45;
            white-space: pre-line;
        }
        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Поисковик ответов</h1>
        <div class="subtitle">Всего вопросов: 60</div>

        <div class="tabs" id="tabs">
            <button class="tab active" data-subject="physics">Физика (60)</button>
        </div>

        <div id="physics-panel" style="display: flex; gap: 8px; margin: 8px 2px; flex-wrap: wrap;">
            <button type="button" class="tab" style="padding: 6px 10px; font-size: 14px;" onclick="insertSymbol('Па')">Па</button>
            <button type="button" class="tab" style="padding: 6px 10px; font-size: 14px;" onclick="insertSymbol('кг')">кг</button>
            <button type="button" class="tab" style="padding: 6px 10px; font-size: 14px;" onclick="insertSymbol('Дж')">Дж</button> 
            <button type="button" class="tab" style="padding: 6px 10px; font-size: 14px;" onclick="insertSymbol('ν')">ν</button>
            <button type="button" class="tab" style="padding: 6px 10px; font-size: 14px;" onclick="insertSymbol('π')">π</button>
            <button type="button" class="tab" style="padding: 6px 10px; font-size: 14px;" onclick="insertSymbol('°C')">°C</button>
        </div>

        <input class="search" id="search" type="text" placeholder="Введите слово из вопроса или ответа...">
        <div class="counter" id="counter"></div>
        <section class="results" id="results"></section>
    </main>

    <script>
        const quizDatabase = [
            {
                "subject": "physics",
                "question": "Билет №1. Вопрос 1: Механическое движение. Основные величины характеризующие механическое движение. Путь и перемещение. Система отчета. Материальная точка.",
                "correct": "Механическое движение — изменение положения тела в пространстве относительно других тел с течением времени.\n• Основные величины: время (t, с), координаты (x, y, z), скорость (v, м/с), ускорение (a, м/с²).\n• Путь (s) — скалярная величина, длина траектории. Перемещение (s) — вектор, соединяющий начальное положение тела с его последующим положением.\n• Система отсчета — совокупность тела отсчета, связанной с ним системы координат и часов.\n• Материальная точка — тело, размерами которого в условиях данной задачи можно пренебречь."
            },
            {
                "subject": "physics",
                "question": "Билет №1. Задача 2: Автомобиль, двигаясь с ускорением 0,5 м/с2, уменьшил свою скорость от 18 до 54 км/ч. Сколько времени ему для этого понадобилось?",
                "correct": "Дано:\na = 0.5 м/с²\nv1 = 18 км/ч = 5 м/с\nv2 = 54 км/ч = 15 м/с\n(Поскольку 54 > 18, это разгон. Берем модуль изменения скорости).\n\nРешение:\na = (v2 - v1) / t => t = (v2 - v1) / a\nt = (15 - 5) / 0.5 = 10 / 0.5 = 20 с.\n\nОтвет: 20 секунд."
            },
            {
                "subject": "physics",
                "question": "Билет №2. Вопрос 1: Закон Ома для участка цепи. Сопротивление. Последовательные и параллельное соединение проводников",
                "correct": "Закон Ома для участка цепи: сила тока прямо пропорциональна напряжению и обратно пропорциональна сопротивлению: I = U / R.\n• Сопротивление (R) — свойство проводника препятствовать току, измеряется в Омах (Ом).\n• Последовательное соединение: I = I1 = I2; U = U1 + U2; R = R1 + R2.\n• Параллельное соединение: U = U1 = U2; I = I1 + I2; 1/R = 1/R1 + 1/R2."
            },
            {
                "subject": "physics",
                "question": "Билет №2. Задача 2: Груз, висящий на пружине, совершает вертикальные колебания. Определить период колебаний, если масса груза 4 кг, а жёсткость пружины 400 Н/м. Принять π = 3,14.",
                "correct": "Дано:\nm = 4 кг, k = 400 Н/м, π = 3.14\n\nРешение:\nT = 2π * √(m / k)\nT = 2 * 3.14 * √(4 / 400) = 6.28 * √0.01 = 6.28 * 0.1 = 0.628 с.\n\nОтвет: 0.628 секунд."
            },
            {
                "subject": "physics",
                "question": "Билет №3. Вопрос 1: Электрический ток. Электрический ток в различной среде. Условия существования постоянного электрического тока.",
                "correct": "Электрический ток — упорядоченное движение заряженных частиц.\n• В различных средах:\n- Металлы: свободные электроны.\n- Электролиты: ионы.\n- Газы: ионы и электроны.\n- Полупроводники: электроны и дырки.\n• Условия существования: наличие свободных носителей заряда, источника тока (внешнего поля) и замкнутость цепи."

                "correct": "Дано:\nλ = 40 м, v = 20 м/с\n\nРешение:\nv = λ * ν => ν = v / λ\nν = 20 / 40 = 0.5 Гц.\n\nОтвет: 0.5 Гц."
            },
            {
                "subject": "physics",
                "question": "Билет №4. Вопрос 1: Радиоактивность. Виды радиоактивных излучений. Естественная радиоактивность. Закон радиоактивного распада. Атомное ядро. Нуклонная модель ядра.",
                "correct": "Радиоактивность — самопроизвольное превращение нестабильных ядер в другие ядра с испусканием частиц.\n• Виды излучений: α-излучение (ядра гелия), β-излучение (электроны), γ-излучение (фотоны).\n• Закон распада: N(t) = N0 * 2^(-t/T).\n• Нуклонная модель: ядро состоит из нуклонов — протонов (Z) и нейтронов (N). Массовое число A = Z + N."
            },
            {
                "subject": "physics",

                "correct": "Дано:\nm = 400 г = 0.4 кг, k = 160 Н/м\n\nРешение:\nν = 1 / T = (1 / 2π) * √(k / m)\nν = (1 / (2 * 3.14)) * √(160 / 0.4) = (1 / 6.28) * √400 = 20 / 6.28 ≈ 3.18 Гц.\n\nОтвет: ≈ 3.18 Гц."

                "correct": "Тепловой двигатель — устройство, превращающее внутреннюю энергию в механическую работу.\n• КПД: η = (Q1 - Q2) / Q1.\n• Цикл Карно — идеальный цикл (2 изотермы, 2 адиабаты), η(max) = (T1 - T2) / T1.\n• Обратимый процесс возвращает систему в исходное состояние без изменений в среде; необратимый — идет в одном направлении.\n• Энтропия (S) — мера хаоса; в замкнутых системах она только возрастает.\n• Применение: ДВС, турбины ТЭЦ/АЭС, реактивные двигатели."

                "correct": "Дано:\nR = 6 Ом, I = 0.2 А\n\nРешение:\nИз закона Ома (I = U / R):\nU = I * R = 0.2 * 6 = 1.2 В.\n\nОтвет: 1.2 В."

                "correct": "Нанотехнологии работают на уровне 1-100 нм.\n• Достижения: графен, углеродные нанотрубки, адресная доставка лекарств, микропроцессоры.\n• Проблемы: высокая стоимость производства, потенциальная токсичность наночастиц.\n• Перспективы: умные самовосстанавливающиеся материалы, квантовые процессоры, энергоэффективные солнечные батареи."

            {

                "correct": "Оптика:\n• Прямолинейное распространение: в однородной среде свет идет прямо.\n• Отражение: падающий, отраженный луч и перпендикуляр лежат в одной плоскости; угол падения равен углу отражения.\n• Преломление: sin(α) / sin(β) = n2 / n1.\n• Линза — прозрачное тело со сферическими гранями (собирающая/рассеивающая).\n• Применение: очки, лупы, микроскопы, фотоаппараты."

                "correct": "Дано:\nε = 6 В, r = 0.5 Ом, R = 5.5 Ом\n\nРешение:\nПо закону Ома для полной цепи: I = ε / (R + r)\nI = 6 / (5.5 + 0.5) = 6 / 6 = 1 А.\n\nОтвет: 1 А."

                "correct": "Деформация — изменение формы/размеров.\n• Виды: растяжение, сжатие, сдвиг, изгиб, кручение. Бывает упругой и пластической.\n• Кристаллы имеют строгий порядок и точную t(плавления). Аморфные тела структуры не имеют, обладают текучестью.\n• Закон Гука для упругих деформаций: Fупр = -kx."

            {
                "subject": "physics",
                "question": "Билет №30. Задача 2: Определите КПД двигателя автомобиля, которому для выполнения работы 110,4 МДж потребовалось 8 кг бензина?",
                "correct": "Дано:\nA = 110.4 МДж = 110.4 * 10^6 Дж, m = 8 кг, q = 46 * 10^6 Дж/кг\n\nРешение:\nПолное тепло: Q = q * m = 46 * 10^6 * 8 = 368 * 10^6 Дж = 368 МДж.\nКПД: η = A / Q\nη = 110.4 МДж / 368 МДж = 0.3 = 30%.\n\nОтвет: 30%."

        const subjectLabels = {
            physics: { name: "Физика", className: "physics" }
        };

        let activeSubject = "physics";
        const search = document.getElementById("search");
        const results = document.getElementById("results");
        const counter = document.getElementById("counter");

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#039;"
            }[char]));
        }

        function render() {
            const rawTerm = search.value.trim();
            const term = rawTerm.toLowerCase();

            const filtered = quizDatabase.filter(item => {
                const plainText = `${item.question} ${item.correct}`.toLowerCase();
                return !term || plainText.includes(term);
            });

            counter.textContent = `Найдено: ${filtered.length}`;
            if (!filtered.length) {
                results.innerHTML = '<div class="empty">Ничего не найдено</div>';
                return;
            }

            results.innerHTML = filtered.map(item => {
                const subject = subjectLabels[item.subject] || { name: item.subject, className: "" };
                return `
                    <article class="card">
                        <span class="badge ${subject.className}">${subject.name}</span>
                        <div class="question">${escapeHtml(item.question)}</div>
                        <div class="answer"><strong>Ответ:</strong> ${escapeHtml(item.correct)}</div>
                    </article>
                `;
            }).join("");
        }

        search.addEventListener("input", render);
        render();

        window.insertSymbol = function(symbol) {
            const searchInput = document.getElementById("search");
            
            const start = searchInput.selectionStart;
            const end = searchInput.selectionEnd;
            const text = searchInput.value;
            
            searchInput.value = text.substring(0, start) + symbol + text.substring(end);
            
            searchInput.focus();
            searchInput.selectionStart = searchInput.selectionEnd = start + symbol.length;
            
            render();
        };
    </script>
</body>
